  successChance: 0.45
  backfireChanceOnFailure: 0.5
  successReward:
  - type: Experimental
    amount: 220
  - type: General
    amount: 60
  failureReward:
  - type: Experimental
    amount: 20
  successExperimentAction: experimentator_artifact_success
  failureExperimentAction: experimentator_artifact_failure
  backfireExperimentAction: experimentator_artifact_backfire
  discoveryTrigger: machine:experimentator-artifact
  backfireDamage:
    types:
      Shock: 20
