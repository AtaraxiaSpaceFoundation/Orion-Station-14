- type: researchExperimentatorOperation
  id: FragmentPulse
  requiredTags:
  - ArtifactFragment
  successChance: 0.65
  backfireChanceOnFailure: 0.25
  successReward:
  - type: General
    amount: 120
  - type: Experimental
    amount: 80
  failureReward:
  - type: General
    amount: 35
  successExperimentAction: experimentator_fragment_success
  failureExperimentAction: experimentator_fragment_failure
  backfireExperimentAction: experimentator_fragment_backfire
  discoveryTrigger: machine:experimentator-fragment
  backfireDamage:
    types:
      Heat: 8

- type: researchExperimentatorOperation
  id: AnomalousPulse
  requiredTags:
