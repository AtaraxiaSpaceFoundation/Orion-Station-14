- type: entity
  parent: BaseMachinePowered
  id: QuantumServer
  name: quantum server
  description: High density simulation hardware for virtual domains.
  components:
  - type: Sprite
    sprite: _Orion/Structures/Machines/quantum_server.rsi
    layers:
    - state: qserver_off
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: qserver_on
      visible: false
      map: ["qserver_on"]
    - state: qserver_panel
      visible: false
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: false }
          False: { visible: true }
        qserver_on:
          True: { visible: true }
          False: { visible: false }
      enum.WiresVisuals.MaintenancePanelState:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: true }
          False: { visible: false }
  - type: QuantumServer
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 1000
        mask:
        - MachineMask
        layer:
        - MachineLayer

- type: entity
  parent: BaseComputer
  id: QuantumConsole
  name: quantum console
  description: Console for selecting and controlling bitrunning domains.
  components:
  - type: Sprite
    sprite: Structures/Machines/computers.rsi
    state: generic
  - type: ActivatableUI
    key: enum.QuantumConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.QuantumConsoleUiKey.Key:
        type: QuantumConsoleBoundUserInterface
  - type: QuantumConsole

- type: entity
  parent: BaseMachinePowered
  id: Netpod
  name: netpod
  description: Neural link pod for bitrunning avatar sessions.
  components:
  - type: Sprite
    sprite: _Orion/Structures/Machines/netpod.rsi
    layers:
    - state: netpod
      map: ["base"]
    - state: netpod_panel
      visible: false
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.NetpodVisuals.State:
        base:
          Open: { state: netpod }
          Closed: { state: netpod_closed }
          Active: { state: netpod_closed_active }
          OpenActive: { state: netpod_open_active }
          Opening: { state: netpod_opening }
          Closing: { state: netpod_closing }
      enum.WiresVisuals.MaintenancePanelState:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: true }
          False: { visible: false }
  - type: ContainerContainer
    containers:
      netpod-body:
        !type:ContainerSlot
  - type: EmptyOnMachineDeconstruct
    containers:
      - netpod-body
  - type: DragInsertContainer
    containerId: netpod-body
    entryDelay: 1
  - type: ExitContainerOnMove
    containerId: netpod-body
  - type: ActivatableUI
    key: enum.NetpodUiKey.Key
  - type: UserInterface
    interfaces:
      enum.NetpodUiKey.Key:
        type: NetpodBoundUserInterface
  - type: Netpod
