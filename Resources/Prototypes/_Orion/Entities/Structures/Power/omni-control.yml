# APC that provides OMNI-power with gravity (compact? uhh uhh...)
- type: entity
  parent: DebugAPCRecharging
  id: OmniControlUnit
  name: omni-control unit
  description: A compact all-in-one utility core that provides power and local gravity.
  suffix: DEBUG, Power-Gravity
  components:
  - type: Battery
    autoRechargeRate: 50000
    autoRecharge: True
  - type: PowerNetworkBattery
    maxSupply: 2147483647
    maxChargeRate: 2147483647
    supplyRampTolerance: 2147483647
    supplyRampRate: 2147483647
  - type: GravitySource

- type: entity
  parent: OmniControlUnit
  id: OmniControlUnitUnlocked
  name: omni-control unit
  description: A compact all-in-one utility core that provides power and local gravity.
  suffix: DEBUG, Power-Gravity, Unlocked
  components:
  - type: AccessReader
    access: [ ]
