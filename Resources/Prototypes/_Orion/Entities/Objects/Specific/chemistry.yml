- type: entity
  parent: BaseBeakerMetallic
  id: XLargeBeaker
  name: X-large beaker
  description: An extra-large beaker.
  components:
  - type: Spillable
    solution: beaker
  - type: Sprite
    sprite: _Orion/Objects/Specific/Chemistry/beaker_x_large.rsi
    layers:
      - state: beakerxlarge
      - state: beakerxlarge1
        map: ["enum.SolutionContainerLayers.Fill"]
        visible: false
  - type: Item
    sprite: _Orion/Objects/Specific/Chemistry/beaker_x_large.rsi
    size: Normal
  - type: SolutionContainerVisuals
    maxFillLevels: 6
    fillBaseName: beakerxlarge
    inHandsMaxFillLevels: 4
    inHandsFillBaseName: -fill-
  - type: SolutionContainerManager
    solutions:
      beaker:
        maxVol: 150
  - type: PhysicalComposition
    materialComposition:
      Glass: 62
      Plastic: 75
  - type: StaticPrice
    price: 30

- type: entity
