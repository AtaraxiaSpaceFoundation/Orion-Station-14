- type: entity
  parent: Medkit
  id: Surgerykit
  name: Surgery kit
  description: A compact kit stocked with the essential surgical instruments for a full operation.
  components:
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,2,3
    - 3,0,3,4
    - 0,4,1,4
    - 0,5,3,6
    whitelist:
      tags:
        - Bottle
        - CigPack
        - PillCanister
        - SurgeryTool
        - MedicalPatch
        - Mask
      components:
        - FingerprintMask
  - type: Sprite
    sprite: _Orion/Objects/Specific/Medical/firstaidkits.rsi
    state: surgerykit
  - type: Item
    sprite: _Orion/Objects/Specific/Medical/firstaidkits.rsi
    heldPrefix: surgerykit
    shape:
    - 0,0,3,2

