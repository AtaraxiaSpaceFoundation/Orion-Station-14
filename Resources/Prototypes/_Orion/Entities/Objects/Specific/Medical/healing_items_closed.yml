- type: entity
  parent: BaseItem
  id: BaseHealingItemClosed
  abstract: true
  components:
  - type: Tag
    tags:
    - Ointment
  - type: Sprite
    sprite: Objects/Specific/Medical/medical.rsi
    state: regenerative-mesh-closed
  - type: Item
    sprite: Objects/Specific/Medical/medical.rsi
    heldPrefix: regenerative-mesh
    size: Small
  - type: SpawnItemsOnUse
    items:
    - id: RegenerativeMeshOpened
    sound:
      path: /Audio/_Orion/Items/Medical/regenerative_mesh/regen_mesh_ripped.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Orion/Items/Medical/regenerative_mesh/regen_mesh_drop1.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Orion/Items/Medical/regenerative_mesh/regen_mesh_drop1.ogg
  - type: StaticPrice
    price: 0

- type: entity
  parent: BaseHealingItemClosed
  id: RegenerativeMesh
  name: regenerative mesh
  description: Used to treat even the nastiest burns. Also effective against caustic burns. It's still in a wrapper.
  components:
  - type: StaticPrice
    price: 20

- type: entity
  parent: BaseHealingItemClosed
  id: AdvancedRegenerativeMesh
  name: advanced regenerative mesh
  description: An advanced mesh made with aloe extracts and sterilizing chemicals, used to treat burns. It's still in a wrapper.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/medical.rsi
    state: aloe-mesh-closed
  - type: Item
    sprite: Objects/Specific/Medical/medical.rsi
    heldPrefix: aloe-mesh
  - type: SpawnItemsOnUse
    items:
    - id: AdvancedRegenerativeMeshOpened
  - type: StaticPrice
    price: 50
