- type: entity
  name: Paladin pump shotgun
  parent: [BaseWeaponShotgun, BaseGunWieldable, BaseSecurityContraband]
  id: WeaponShotgunPaladin12
  suffix: Shotgun
  description: A nine-round pump action shotgun. A shotgun used for hunting, home defence and police work, many versions of it exist and are used by just about anyone.
  components:
  - type: Sprite
    sprite: _Orion/Objects/Weapons/Guns/Shotguns/paladin-12/big.rsi
  - type: Item
    sprite: _Orion/Objects/Weapons/Guns/Shotguns/paladin-12/tiny.rsi
  - type: Clothing
    sprite: _Orion/Objects/Weapons/Guns/Shotguns/paladin-12/tiny.rsi
  - type: BallisticAmmoProvider
    capacity: 9
    autoCycle: false
    soundRack:
      path: /Audio/_Orion/Weapons/Guns/Shotguns/shotgun_cmb_pump.ogg
