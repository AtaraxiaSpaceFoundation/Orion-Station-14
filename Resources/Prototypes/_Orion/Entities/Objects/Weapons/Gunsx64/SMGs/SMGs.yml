- type: entity
  name: P-90
  parent: [BaseWeaponSubMachineGun, BaseSecurityContraband]
  id: WeaponSubMachineGunP90
  description: The P-90 is the EarthGov standard issue SMG. It's known for its compact size and ease of use inside the field. It's usually carried by troops who want a lightweight firearm to rush with.
  components:
  - type: Sprite
    sprite: _Orion/Objects/Weapons/Gunsx64/SMGs/p90.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Orion/Objects/Weapons/Gunsx64/SMGs/p90.rsi
  - type: Item
    sprite: _Orion/Objects/Weapons/Gunsx64/SMGs/p90.rsi
  - type: GunWieldBonus
    minAngle: -10
    maxAngle: -10
    angleIncrease: -15
  - type: Gun
    angleDecay: 30
    angleIncrease: 15
    cameraRecoilScalar: 1
    minAngle: 25
    maxAngle: 30
    fireRate: 7
    soundGunshot:
      path: /Audio/_Orion/Weapons/Guns64/SMGs/p90.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazinePistolTopSubMachineGun
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazinePistolTopSubMachineGun
      gun_chamber:
        name: Chamber
        startingItem: CartridgePistol # Orion edit
        priority: 1
        whitelist:
          tags:
            - CartridgePistol # Orion edit
  - type: MagazineVisuals
    magState: mag
    steps: 6
    zeroVisible: true
  - type: Appearance
  - type: Wieldable
    unwieldOnUse: false
