# Extraction point for avatars when a domain run is completed or aborted.
- type: entity
  parent: MarkerBase
  id: BitrunningExitMarker
  name: exit marker
  suffix: Bitrunning
  components:
  - type: Sprite
    layers:
    - state: red
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      sensor:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 0
        hard: false
  - type: BitrunningExitMarker

# Anchor point for the domain's main objective area.
- type: entity
  parent: MarkerBase
  id: BitrunningGoalMarker
  name: goal marker
  suffix: Bitrunning
  components:
  - type: Sprite
    layers:
    - state: red
  - type: BitrunningGoalMarker

# Spawn point for collectible encrypted cache objectives.
- type: entity
  parent: MarkerBase
  id: BitrunningCacheMarker
  name: cache marker
  suffix: Bitrunning
  components:
  - type: Sprite
    layers:
    - state: red
  - type: BitrunningCacheMarker

# Spawn point for objective crates used by delivery missions.
- type: entity
  parent: MarkerBase
  id: BitrunningCacheCrateMarker
  name: cache crate marker
  suffix: Bitrunning
  components:
  - type: Sprite
    layers:
    - state: red
  - type: BitrunningCacheCrateMarker

# Spawn point used for avatars placement.
- type: entity
  parent: MarkerBase
  id: BitrunningSpawnMarker
  name: spawn marker
  suffix: Bitrunning
  components:
  - type: Sprite
    layers:
    - state: red
  - type: BitrunningSpawnMarker

# Physical delivery zone sensor.
- type: entity
  parent: MarkerBase
  id: BitrunningDeliveryMarker
  name: delivery marker
  suffix: Bitrunning
  components:
  - type: Sprite
    layers:
    - state: green
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      sensor:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 0
        hard: false
  - type: BitrunningObjectiveDeliveryPoint
