# Extraction point for avatars when a domain run is completed or aborted.
- type: entity
  id: BitrunningExitMarker
  name: exit marker
  suffix: Bitrunning
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    drawdepth: Overdoors
    sprite: _Orion/Structures/Machines/byteforge.rsi
    layers:
    - state: on_particles
      shader: unshaded
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      sensor:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        mask:
        - MobMask
        layer:
        - MobLayer
        density: 0
        hard: false
  - type: BitrunningExitMarker

# Anchor point for the domain's main objective area.
- type: entity
  parent: MarkerBase
  id: BitrunningGoalMarker
  name: goal marker
  suffix: Bitrunning
  components:
  - type: Sprite
    layers:
    - state: red
  - type: BitrunningGoalMarker

# Spawn point for collectible encrypted cache objectives.
- type: entity
  parent: MarkerBase
  id: BitrunningCacheMarker
  name: encrypted cache spawn marker
  suffix: Bitrunning
  components:
  - type: Sprite
    layers:
    - state: red
  - type: BitrunningCacheMarker

# Spawn point for objective crates used by delivery missions.
- type: entity
  parent: MarkerBase
  id: BitrunningCacheCrateMarker
  name: cache crate spawn marker
  suffix: Bitrunning
  components:
  - type: Sprite
    layers:
    - state: red
  - type: BitrunningCacheCrateMarker

# Spawn point used for avatars placement.
- type: entity
  id: BitrunningSpawnMarker
  name: avatar spawn marker
  suffix: Bitrunning
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    drawdepth: Overdoors
    sprite: _Orion/Structures/Machines/byteforge.rsi
    layers:
    - state: on_particles_angry
      shader: unshaded
  - type: Physics
    bodyType: Static
  - type: BitrunningSpawnMarker

# Physical delivery zone sensor.
- type: entity
  id: BitrunningDeliveryMarker
  name: cache delivery marker
  suffix: Bitrunning
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    drawdepth: Overdoors
    sprite: _Orion/Structures/Machines/byteforge.rsi
    layers:
    - state: on_particles
      shader: unshaded
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      sensor:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        mask:
        - ItemMask
        layer:
        - SlipLayer
        density: 0
        hard: false
  - type: BitrunningObjectiveDeliveryPoint
