- type: constructionGraph
  id: VisorMedHUD
  graph:
    - node: start
      edges:
        - to: MedVisor
          steps:
            - tag: MedSunglasses
              name: construction-graph-tag-med-glasses
              icon:
                sprite: _Goobstation/Clothing/Eyes/Glasses/medglasses.rsi
                state: icon
              doAfter: 3
            - tag: ChemVisor
              name: construction-graph-tag-chemical-hud
              icon:
                sprite: Clothing/Eyes/Glasses/science.rsi
                state: icon
              doAfter: 3
            - material: Glass
              amount: 1
              doAfter: 3

    - node: MedVisor
      entity: ClothingEyesAdvancedMedVisor
      edges:
      - to: start
        steps:
        - tool: Screwing
          doAfter: 5
        completed:
        - !type:SpawnPrototype
          prototype: ClothingEyesGlassesMed
        - !type:SpawnPrototype
          prototype: ClothingEyesGlassesChemical
        - !type:DeleteEntity
