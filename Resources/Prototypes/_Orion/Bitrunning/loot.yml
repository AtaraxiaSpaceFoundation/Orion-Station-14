- type: entityTable
  id: BitrunningDeliveryEasyLoot
  table: !type:GroupSelector
    rolls: !type:RangeNumberSelector
      range: 2, 3
    children:
    - id: SpaceCash100
      weight: 3
    - id: SpaceCash500
      weight: 1

