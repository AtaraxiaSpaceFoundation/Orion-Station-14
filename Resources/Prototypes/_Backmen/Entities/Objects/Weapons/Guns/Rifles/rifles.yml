  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineHeavyRifleBR64
        insertSound: /Audio/_Backmen/Weapons/Guns64/Rifles/m41a_reload.ogg
        ejectSound: /Audio/_Backmen/Weapons/Guns64/Rifles/m41a_unload.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineHeavyRifle62
  - type: ContainerContainer
    containers:
