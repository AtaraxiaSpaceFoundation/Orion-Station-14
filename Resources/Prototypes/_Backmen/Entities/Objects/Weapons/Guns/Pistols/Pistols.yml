- type: entity  # Orion edit-start
  name: combat pistol VP-78
  parent: BaseWeaponPistol
  id: WeaponPistolVP78
  description: The VP-78, produced by Markus Henday Inc. A massive, formidable automatic handgun chambered in .20 rounds.
  components:
  - type: Sprite
    sprite: _Backmen/Objects/Weapons/Gunsx64/Pistols/vp78/big.rsi
  - type: Item
    sprite: _Backmen/Objects/Weapons/Gunsx64/Pistols/vp78/tiny.rsi
  - type: Gun
    angleIncrease: 2
    angleDecay: 10
    cameraRecoilScalar: 3
    fireRate: 5
    maxAngle: 10
    minAngle: 3
    selectedMode: FullAuto
    availableModes:
      - FullAuto
    soundGunshot:
      path: /Audio/_Backmen/Weapons/Guns64/Pistols/vp70_shot.ogg
    soundEmpty:
      path: /Audio/_Backmen/Weapons/Guns64/Pistols/vp70_empty.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazinePistol57x28
        insertSound: /Audio/_Backmen/Weapons/Guns64/Pistols/vp70_reload.ogg
        ejectSound: /Audio/_Backmen/Weapons/Guns64/Pistols/vp70_unload.ogg
        priority: 2
        whitelist:
          tags:
            - MagazinePistol57x28
      gun_chamber:
        name: Chamber
        startingItem: CartridgeRifle
        priority: 1
        whitelist:
          tags:
            - CartridgeRifle
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot

